name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build debug APK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk LiveCallTranslator.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LiveCallTranslator-apk
          path: LiveCallTranslator.apk
      # Direct download (bina ZIP): .../releases/latest/download/LiveCallTranslator.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" LiveCallTranslator.apk \
            --title "Live Call Translator $TAG" \
            --notes "Phone me seedha install karein: LiveCallTranslator.apk" \
            --latest
